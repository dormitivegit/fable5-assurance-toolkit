[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "software-evidence-controls"
version = "0.4.0rc1"
description = "Local deterministic CLI for evidence controls; no third-party dependencies"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.scripts]
software-evidence-controls = "software_evidence_controls.cli:main"

[project.urls]
Repository = "https://github.com/dormitivegit/software-evidence-controls"
Issues = "https://github.com/dormitivegit/software-evidence-controls/issues"

[tool.setuptools.packages.find]
where = ["src"]
