[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fable5-assurance-toolkit"
version = "0.3.0rc6"
description = "Local deterministic assurance controls reconstructed under a new lineage"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.scripts]
assurance = "assurance_toolkit.cli:main"

[project.urls]
Repository = "https://github.com/dormitivegit/fable5-assurance-toolkit"
Issues = "https://github.com/dormitivegit/fable5-assurance-toolkit/issues"

[tool.setuptools.packages.find]
where = ["src"]
